<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouchon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..700,100,1;1,9..144,400..500,100,1&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Direction artistique : carnet de pêcheur illustré. Scènes peintes à gauche, carnet papier à droite. */
:root{
  --bg:#12302f; --bg2:#1c4744; --cream:#f6eddb; --creamdim:#b9cdbf;
  --panel:#f6eddb; --panel2:#ede1c8; --paper3:#e4d5b7; --ink:#1d2c2f; --line:#d6c5a2; --line2:#c2ae86;
  --text:#25343a; --muted:#6a7670; --accent:#c8432c; --gold:#8f6210; --goldf:#e6b23e; --ok:#35803a; --orange:#bd6a10; --blue:#2a6fb5;
  --r1:#66736e; --r2:#35803a; --r3:#2a6fb5; --r4:#b8660a;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Nunito','Segoe UI','Trebuchet MS',sans-serif;
  --sh1:0 1px 2px rgba(20,30,30,.18);
  --sh2:0 2px 4px rgba(10,25,25,.2),0 10px 24px rgba(6,20,20,.28);
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--cream);margin:0;min-height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;background:radial-gradient(1100px 620px at 28% -8%,var(--bg2),transparent 72%),var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1340px;margin:0 auto;padding:18px 16px 32px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:600;font-size:36px;margin:0;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:8px;font-variation-settings:'SOFT' 100,'WONK' 1}
.brand h1 svg{width:17px;height:30px;transform:rotate(14deg);flex:none}
.brand p{margin:5px 0 0;color:var(--creamdim);font-size:14px;font-family:var(--display);font-style:italic}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.stat{background:var(--panel);color:var(--text);border-radius:10px;box-shadow:var(--sh1);padding:6px 12px 7px;min-width:92px;display:grid}
.stat .lbl{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;white-space:nowrap}
#money{color:var(--gold)} #money.neg{color:var(--accent)}
.mute{font-size:13px;align-self:stretch}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{display:grid;gap:10px;min-width:0}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#0d2120;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.08),var(--sh2);user-select:none;-webkit-user-select:none;overflow:hidden}
.screen canvas{display:block;width:100%;height:100%;touch-action:none}
.screen.fishing #game{cursor:pointer}
.where{position:absolute;left:10px;top:10px;background:rgba(14,28,30,.72);color:var(--cream);border-radius:8px;padding:4px 10px;font-family:var(--display);font-size:13px;font-weight:500;pointer-events:none;backdrop-filter:blur(3px)}
.maplabels{position:absolute;inset:0}
.ml{position:absolute;transform:translate(-50%,6px);font-family:var(--body);font-size:11.5px;font-weight:700;line-height:1.15;color:var(--text);background:rgba(250,244,229,.93);border:0;border-radius:6px;box-shadow:0 1px 3px rgba(20,25,20,.38);padding:2px 6px;white-space:nowrap;cursor:pointer;transition:background .12s,box-shadow .12s}
.ml.town{font-family:var(--display);font-weight:600;font-size:12px}
.ml.size2{font-size:13.5px;background:#fff7e0}
.ml.spot{color:#1d4f6b}
.ml.locked{color:var(--muted);background:rgba(232,226,212,.82);font-weight:600}
.ml.here{box-shadow:0 0 0 2px var(--ok),0 1px 3px rgba(20,25,20,.38)}
.ml.sel{background:var(--goldf);color:var(--ink)}
.ml.ev::after{content:"!";display:inline-block;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800}
.ml:hover{box-shadow:0 0 0 2px var(--goldf),0 1px 3px rgba(20,25,20,.38)}
.ml:focus-visible{outline:2px solid var(--goldf);outline-offset:1px}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(14,28,30,.9);color:var(--cream);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13.5px;max-width:92%;text-align:center;pointer-events:none;z-index:5;box-shadow:0 0 0 1.5px var(--goldf),0 4px 12px rgba(0,0,0,.3)}
.mg{position:absolute;left:5%;right:5%;bottom:6%;background:rgba(248,241,225,.96);color:var(--text);border-radius:12px;box-shadow:0 6px 20px rgba(5,20,20,.4);padding:9px 14px 11px;display:grid;gap:9px}
.mgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mgh canvas{width:auto;height:30px;opacity:.82}
.mgh b{font-family:var(--display);font-size:15px;font-weight:600}
.mgh span{color:var(--muted);font-size:13px}
.mgh span b{font-family:var(--body);font-size:13px;color:var(--text)}
.gauge{position:relative;height:22px;background:linear-gradient(#d65a48,#b93c2b);border-radius:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.seg{position:absolute;top:0;bottom:0}
.seg.o{background:linear-gradient(#f0a542,#d98420)}
.seg.g{background:linear-gradient(#66bc58,#3f9a3e);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.cursor{position:absolute;top:-6px;bottom:-6px;width:5px;margin-left:-2.5px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px var(--ink),0 2px 4px rgba(0,0,0,.35)}
.mgl{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;font-weight:600}
.mgl i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:50%}
.dice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,20,22,.5);pointer-events:none}
.die{width:86px;height:100px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:linear-gradient(155deg,#fbe39a 0 45%,#e4ae3e 45% 100%);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:34px;color:var(--ink);padding-top:8px}
.die.roll{animation:wob .22s ease-in-out infinite alternate}
.die.win{background:linear-gradient(155deg,#b2e8a4 0 45%,#4fae4c 45% 100%)}
.die.lose{background:linear-gradient(155deg,#f4a494 0 45%,#c8432c 45% 100%)}
@keyframes wob{0%{transform:rotate(-12deg) translateY(0)}100%{transform:rotate(12deg) translateY(-10px)}}
.dtxt{background:rgba(248,241,225,.97);color:var(--text);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.catch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,20,22,.52);padding:10px}
.card{background:var(--panel);color:var(--text);border-radius:16px;box-shadow:0 0 0 2px var(--goldf),0 14px 40px rgba(0,0,0,.45);padding:10px 18px 12px;display:grid;gap:6px;justify-items:center;max-width:94%;max-height:100%;overflow:auto;scrollbar-width:thin;text-align:center}
.card canvas{max-width:100%;height:auto;max-height:clamp(64px,24vh,190px);object-fit:contain;filter:drop-shadow(0 5px 5px rgba(40,50,40,.26))}
.card h2{font-family:var(--display);font-size:24px;font-weight:600;margin:0;line-height:1.1}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border:1.5px solid currentColor;border-radius:999px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--accent);color:#fff;padding:3px 9px;border-radius:999px}
.badge.gold{background:var(--goldf);color:var(--ink)}
.cstats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.cstats div{display:grid}
.cstats small{color:var(--muted);font-size:12px;font-weight:600}
.cstats b{font-family:var(--display);font-weight:600;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{margin:2px 2px 0;color:var(--creamdim);font-size:14.5px;min-height:1.4em}
.hint b{color:var(--cream)}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:var(--panel);color:var(--text);border-radius:10px;box-shadow:var(--sh1);padding:9px 12px 11px;font-size:14px;font-weight:600}
.goal .gl{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
.goal .gb{height:7px;background:var(--paper3);border-radius:4px;overflow:hidden;grid-column:1 / -1}
.goal .gb i{display:block;height:100%;background:linear-gradient(90deg,#e6b23e,#d8892b);border-radius:4px}
.goal .gn{color:var(--muted);font-weight:600;font-size:13px}
.news{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:14px}
.news li{background:rgba(246,237,219,.1);color:var(--cream);border-radius:9px;padding:6px 12px;display:flex;gap:10px;align-items:baseline;border-left:3px solid var(--creamdim)}
.news li b{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;flex:none;min-width:84px}
.news .sea{border-color:#8ed07f}.news .sea b{color:#a5de97}
.news .ev{border-color:#f0826c}.news .ev b{color:#f79a86}
.news .ord{border-color:var(--goldf)}.news .ord b{color:#f0c864}
.news .pay{border-color:#7dbcf0}.news .pay b{color:#9ccdf5}
.panel{background:var(--panel);color:var(--text);border-radius:14px;box-shadow:var(--sh2);min-width:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#183c3a;padding:7px 7px 0;gap:4px}
.tabs button{font-family:var(--display);font-size:14px;font-weight:500;color:#cfdccd;background:rgba(255,255,255,.08);border:0;border-radius:9px 9px 0 0;padding:9px 2px;cursor:pointer;transition:background .12s}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);font-weight:600}
.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--goldf);outline-offset:2px}
.pane{padding:16px;display:grid;gap:16px;max-height:calc(100vh - 140px);overflow:auto;scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
@media (max-width:1000px){.pane{max-height:none}}
.sec{display:grid;gap:8px}
.sec h3{margin:0;font-family:var(--display);font-style:italic;font-size:15px;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:10px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{font-family:var(--display);font-style:italic;font-size:14px;color:var(--gold);margin:4px 0 0}
.ph{display:grid;gap:2px}
.ph h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15}
.ph span{color:var(--muted);font-size:14px}
.btn{font-family:var(--body);font-size:14.5px;font-weight:700;color:var(--text);background:#fbf5e6;border:1px solid var(--line2);border-radius:9px;box-shadow:0 1px 0 var(--line2);padding:7px 11px;cursor:pointer;text-align:left;transition:background .12s,transform .06s}
.btn:hover:not(:disabled){background:#fffaf0}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.48;cursor:not-allowed}
.btn.sel{background:#dcebc9;border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.btn.buy{background:#f2c95c;border-color:#c2952e;box-shadow:0 1px 0 #b18526;color:var(--ink);text-align:center}
.btn.buy:hover:not(:disabled){background:#f7d674}
.btn.main{background:var(--accent);border-color:#a53420;box-shadow:0 1px 0 #8f2c1a;color:#fff;text-align:center;font-weight:800}
.btn.main:hover:not(:disabled){background:#d84f37}
.btn.go{background:#2f7d55;border-color:#236343;box-shadow:0 1px 0 #1d5439;color:#fff;text-align:center;font-weight:800}
.btn.go:hover:not(:disabled){background:#378d61}
.btn.c{text-align:center}
.btn.sm{font-size:12.5px;padding:3px 9px}
.btn.red{background:transparent;color:var(--accent);border-color:var(--accent);box-shadow:none;text-align:center}
.btn.red:hover:not(:disabled){background:#f6dcd2}
select{font-family:var(--body);font-size:14px;font-weight:600;background:#fbf5e6;color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:5px 6px;width:100%;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.baits{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bait{display:flex;justify-content:space-between;gap:6px;font-size:13.5px}
.bait .cnt{color:var(--muted)}
.bait[data-empty] .cnt{color:var(--accent)}
.box{background:var(--panel2);border-radius:9px;padding:9px 11px;font-size:14px;display:grid;gap:6px}
.box b{color:var(--gold)}
.box.hot{background:#f8e2a8;box-shadow:inset 0 0 0 1.5px var(--goldf)}
.bad{color:var(--accent);font-weight:700} .good{color:var(--ok);font-weight:700}
.kv{display:grid;gap:4px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px;align-items:center}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.shop{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.item .nm{font-weight:800}
.item .ds{grid-column:1;font-size:13px;color:var(--muted)}
.item .bt{grid-row:1 / span 2;grid-column:2}
.own{font-size:11px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.04em}
.low{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.why{font-size:13px;color:var(--muted);margin:0}
.flist{display:grid;gap:7px}
.frow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;font-weight:700;padding-bottom:7px;border-bottom:1px solid var(--line)}
.frow canvas{max-width:100%;height:auto;justify-self:center}
.frow small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.frow .pr{text-align:right;font-size:12.5px;color:var(--muted);font-weight:600}
.frow .pr b{color:var(--gold);font-weight:800}
.fresh{font-size:9.5px;font-weight:800;padding:1px 6px;border:1px solid currentColor;border-radius:999px;margin-left:5px;white-space:nowrap}
.f0{color:var(--ok)} .f2{color:var(--gold)} .f3{color:var(--orange)} .f4{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;margin:0}
.goals{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;font-weight:600}
.goals li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.goals li::before{content:"";width:12px;height:12px;margin-top:3px;border:1.5px solid var(--line2);border-radius:50%}
.goals li.done{color:var(--muted);text-decoration:line-through;font-weight:500}
.goals li.done::before{background:var(--ok);border-color:var(--ok)}
.goals li.cur{color:var(--gold);font-weight:800}
.goals li.cur::before{border-color:var(--gold);background:#f2c95c}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{background:#fbf6e9;border:1px solid var(--line);border-radius:10px;padding:9px;display:grid;gap:4px;align-content:start;font-size:13px}
.dcard canvas{max-width:100%;height:auto;justify-self:center;margin:2px 0}
.dcard .dn{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15}
.dcard .dc{color:var(--muted);font-size:12px}
.keys{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
.keys kbd{font-family:var(--body);font-size:11px;font-weight:800;color:var(--text);background:#fbf5e6;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,20,20,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--panel);color:var(--text);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:640px;width:100%;max-height:100%;overflow:auto;padding:24px 26px;display:grid;gap:12px}
.mcard h2{margin:0;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.12}
.mcard p{margin:0}
.mcard .ey{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:5px}
.rep{display:grid;gap:4px;font-size:15px}
.rep div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.rep .tot{font-weight:800;border-bottom:0;font-size:17px}
.rep h4{margin:6px 0 0;font-family:var(--display);font-style:italic;font-size:14px;color:var(--gold);font-weight:500}
.plus{color:var(--ok);font-weight:700} .minus{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.btn:active:not(:disabled){transform:none}}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder i{height:7px;border-radius:4px;background:var(--paper3)}
.ladder i.on{background:var(--ok)}
.ladder i.cur{background:var(--goldf)}
.tech{position:absolute;left:18%;right:18%;bottom:7%;background:rgba(248,241,225,.96);color:var(--text);border-radius:12px;box-shadow:0 6px 20px rgba(5,20,20,.4);padding:9px 14px 10px;display:grid;gap:7px;pointer-events:none}
.tech b{font-family:var(--display);font-size:15px;font-weight:600}
.tech small{color:var(--muted);font-size:12.5px;font-weight:600}
.tbar{position:relative;height:16px;border-radius:6px;background:linear-gradient(#d65a48,#b93c2b)}
.tband{position:absolute;left:42%;width:30%;top:0;bottom:0;background:linear-gradient(#66bc58,#3f9a3e)}
.tcur{position:absolute;top:-4px;bottom:-4px;width:5px;margin-left:-2.5px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.skills{display:grid;gap:9px}
.skill{display:grid;gap:3px}
.skill .sn{display:flex;justify-content:space-between;font-size:13.5px}
.skill .sn span{color:var(--muted);font-weight:700;font-size:12.5px}
.skill .sg{height:7px;border-radius:4px;background:rgba(40,60,60,.14);overflow:hidden}
.skill .sg i{display:block;height:100%;background:linear-gradient(90deg,#4f9a77,#6fbf8f)}
.skill small{color:var(--muted);font-size:12px;font-weight:600}
.pg{background:#f6ecd2;border-radius:6px;padding:9px 12px;margin-bottom:7px;box-shadow:inset 0 0 0 1px rgba(120,90,40,.18)}
.pg b{font-family:var(--display);font-weight:600;font-size:14px;color:#55401d}
.pg p{margin:3px 0 0;font-style:italic;font-size:13.5px;color:#55401d}
.box.quest{box-shadow:inset 3px 0 0 var(--gold)}
.bub{background:#f6ecd2;border-radius:10px;padding:10px 14px;margin:8px 0 12px;box-shadow:inset 0 0 0 1px rgba(120,90,40,.2);color:#3f3218}
.bub b{font-family:var(--display);font-weight:600;font-size:14.5px;color:#8a3f24}
.bub p{margin:3px 0 0;font-size:14.5px;line-height:1.45}
.bub.nar p{font-style:italic;margin:0}
.bub.npc{margin:6px 0 10px;padding:8px 12px}
.bub.npc p{font-size:13.5px}
.cours{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:600}
.cours .up b{color:var(--ok)}
.cours .dn b{color:var(--accent)}
small.trait{color:var(--muted);font-weight:700;font-style:italic}
</style>
</head>
<body>
<div class="app">

  Object.values(S.sat).forEach(m=>Object.keys(m).forEach(k=>{m[k]=Math.floor(m[k]*(S.ending==='large'?.4:S.ending==='comptoir'?.75:.6));if(!m[k])delete m[k];}));
  if((S.day-1)%SEASON_LEN===0)Rp.season=SEASONS[season()];
  {const ex=S.contracts.filter(o=>S.day>o.until);if(ex.length){Rp.expired=ex[0];S.contracts=S.contracts.filter(o=>S.day<=o.until);}}
  Rp.ev=rollEvent();Rp.order=rollOrder();
  S.min=6*60;S.weather=rollWx();save();renderAll();
  const net=Rp.rev-Rp.charges;
  let h=`<span class="ey">Fin de journée</span><h2>Jour ${dayDone} terminé</h2><div class="rep">`;
  if(Rp.shops.length){h+=`<h4>Poissonneries</h4>${Rp.shops.map(l=>`<div><span>${l.n} · ${l.cnt} vendu${l.cnt>1?'s':''}${l.del?` · ${l.del} livré${l.del>1?'s':''} par tes pêcheurs`:''}${l.left?` · ${l.left} en stock`:' · <span class="minus">stock vide</span>'}</span><span class="plus">+${fmt(l.r)}</span></div>`).join('')}
    <div><span>Charges des boutiques</span><span class="minus">−${fmt(Rp.charges)}</span></div>`;}
  if(Rp.prize)h+=`<h4>Concours</h4><div><span>${FBY[Rp.prize.sp].n} de ${fmtW(Rp.prize.w)}</span><span class="plus">+${fmt(Rp.prize.amt)}</span></div>`;
  if(Rp.payday){h+=`<h4>Paie de la semaine</h4>${Rp.wages?`<div><span>Salaires versés</span><span class="minus">−${fmt(Rp.wages)}</span></div>`:''}${Rp.quits.map(s=>`<div><span class="minus">${s.name} (${STAFF[s.type].n.toLowerCase()}) démissionne : paie non versée</span><span></span></div>`).join('')}`;}
  const tot=net+(Rp.prize?Rp.prize.amt:0)-Rp.wages;
  if(Rp.shops.length||Rp.prize||Rp.payday)h+=`<div class="tot"><span>Bilan de la nuit</span><span class="${tot>=0?'plus':'minus'}">${tot>=0?'+':'−'}${fmt(Math.abs(tot))}</span></div>`;
  else h+=`<p>Pas encore de poissonnerie : tes revenus viennent de ce que tu vends toi-même.</p>`;
  h+=`</div>`;
  if(Rp.rival)h+=`<div class="rep">${Rp.rival}</div>`;
  if(Rp.rot)h+=`<p class="minus">${Rp.rot} poisson${Rp.rot>1?'s':''} trop vieux jeté${Rp.rot>1?'s':''}.</p>`;
  if(Rp.season)h+=`<p><b style="color:var(--ok)">Nouvelle saison : ${Rp.season.n}.</b> ${Rp.season.note}</p>`;
  if(Rp.expired)h+=`<p class="why">Le contrat de ${TOWNS[Rp.expired.tid].n} a expiré. Pas de pénalité.</p>`;
  if(Rp.ev)h+=`<p><b style="color:var(--accent)">Événement :</b> ${evText(Rp.ev)}</p>`;
  if(Rp.order)h+=`<p><b style="color:var(--gold)">Nouveau contrat :</b> ${ordText(Rp.order)}.</p>`;
  if(S.staff.length&&!Rp.payday)h+=`<p class="why">Prochaine paie : ${fmt(wagesTotal())} à la fin du jour ${nextPayday()}.</p>`;
  maybeDecision();h+=`<p>Jour ${S.day} · ${SEASONS[season()].n} · météo : <b>${wxName(S.weather)}</b>.</p><div class="row" style="justify-content:flex-end"><button class="btn main" id="mOk">Commencer le jour ${S.day}</button></div>`;
  openModal(h);$('#mOk').onclick=closeModal;$('#mOk').focus();
}

/* ================= PÊCHE ================= */
function canBite(f){if(BOSS[f.id]&&S.bosses[f.id])return false;if(f.s!==S.loc||!f.baits.includes(S.bait)||!inSeason(f))return false;const h=hour();if(f.hours&&!f.hours.some(w=>inH(h,w)))return false;if(f.wx&&!under()&&!f.wx.includes(S.weather))return false;if(f.tide&&!tideHigh())return false;return true;}
function pickFish(){if(S.obs&&S.obs.spot===S.loc){const o=FBY[S.obs.sp];S.obs=null;if(canBite(o)&&Math.random()<.55)return o;}return pickFrom(FISH.filter(canBite));}
function setMode(m){G.mode=m;$('#mg').hidden=m!=='mg'&&m!=='dice';$('#tech').hidden=m!=='retrieve'&&m!=='aim';renderHint();}
let toastT=null;
function toast(msg,ms=2400){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms);}
function resetFishing(){G.mode='idle';G.pick=null;G.mg=null;G.ret=null;G.aim=null;G.boss=null;G.jump=null;$('#tech').hidden=true;$('#mg').hidden=true;$('#dice').hidden=true;$('#catch').hidden=true;G.parts=[];G.rips=[];}
function cast(){
  if(S.view!=='place'||!isSpot()||G.mode!=='idle'||!$('#modal').hidden)return;
  if((S.baits[S.bait]||0)<=0){toast(`Plus de ${BAITS[S.bait].n.toLowerCase()}. Achètes-en en ville.`);sfx('bad');return;}
  if(S.fish.length>=coolCap()){toast('Glacière pleine : va vendre ta pêche en ville.');sfx('bad');return;}
  advance(15);G.miss=false;G.quick=false;if(tech()==='mouche'){startAim();return;}launch(115+Math.random()*190);
}
function setupWait(){const trn=tech()==='traine';G.pick=pickFish();if(trn&&Math.random()<.25)G.pick=null;G.wait=0;G.feinted=false;G.biteAt=G.quick?.5+Math.random()*.7:(trn?2.6+Math.random()*3.4:1.3+Math.random()*2.6);G.nibbles=[];const n=Math.random()*3|0;for(let i=0;i<n;i++)G.nibbles.push(.5+Math.random()*Math.max(.1,G.biteAt-.8));G.nibbles.sort((a,b)=>a-b);G.nib=0;setMode('waiting');}
function startReel(){G.reel={t:0,x:G.bob.x,y:G.bob.y};$('#mg').hidden=true;$('#dice').hidden=true;setMode('reeling');}
function mgParams(f){const r=f.r,b=BEH[behav(f)],isB=!!G.boss,ph=isB?[1.25,1,.8][G.boss.phase]:1;
  const green=GREEN[r]*RODS[S.rod].mult*b.green*ph*(1+.05*(skLv('patience')-1))*(S.bosses.silure?1.1:1),speed=SPEED[r]*REELS[S.reel].mult*b.speed*(1-.04*(skLv('main')-1))*(S.bosses.saumon?.92:1);
  return{green:Math.max(isB?.06:.04,Math.min(.6,green)),orange:ORANGE[r],speed,chance:isB?3:CHANCE[r],move:b.move||0,label:isB?`Boss · phase ${G.boss.phase+1}/3`:`${RAR[r].n} · ${b.n} !`};}
function setSegs(M){const set=(el,a,b)=>{el.style.left=(a*100)+'%';el.style.width=((b-a)*100)+'%';};set($('#segO1'),M.o1,M.gs);set($('#segG'),M.gs,M.ge);set($('#segO2'),M.ge,M.o2);}
function moveZone(M,dt){if(!M.move)return;const w=M.ge-M.gs,lo=M.orange+.02,hi=1-w-M.orange-.02;let g=M.gs+M.zd*M.move*dt;if(g<=lo){g=lo;M.zd=1;}if(g>=hi){g=hi;M.zd=-1;}M.gs=g;M.ge=g+w;M.o1=g-M.orange;M.o2=M.ge+M.orange;setSegs(M);}
function startMG(){
  const f=G.pick;if(BOSS[f.id]&&!G.boss)G.boss={phase:0};const P=mgParams(f),green=P.green,orange=P.orange;
  const lo=orange+.02,hi=1-green-orange-.02,gs=lo+Math.random()*Math.max(0,hi-lo);
  G.mg={gs,ge:gs+green,o1:gs-orange,o2:gs+green+orange,orange,pos:Math.random()<.5?0:1,dir:1,speed:P.speed,chance:P.chance,move:P.move,zd:Math.random()<.5?1:-1,stopped:false};
  if(G.mg.pos===1)G.mg.dir=-1;
  setSegs(G.mg);
  const sil=silhouette(SPR[f.id],'#0a1519'),mc=$('#mgFish');mc.width=sil.width;mc.height=sil.height;mc.getContext('2d').drawImage(sil,0,0);
  $('#mgRar').textContent=P.label;$('#mgRar').style.color=RAR[f.r].c;$('#mgChance').textContent=P.chance;
  setMode('mg');
}
function stopMG(){
  const M=G.mg;if(!M||M.stopped)return;M.stopped=true;sfx('click');
  if(!G.boss||G.boss.phase===0)S.baits[S.bait]=Math.max(0,S.baits[S.bait]-1);
  const p=M.pos,zone=(p>=M.gs&&p<=M.ge)?'g':((p>=M.o1&&p<M.gs)||(p>M.ge&&p<=M.o2))?'o':'r';
  setTimeout(()=>{if(zone==='g')landed();else if(zone==='o')rollDice();else lost('Rouge : le poisson s’est décroché.');},380);
}
function rollDice(){
  setMode('dice');const N=G.mg.chance,die=$('#die'),txt=$('#dtxt');
  $('#dice').hidden=false;die.className='die roll';txt.textContent=`Orange ! Il faut faire 1 à ${N} sur 10`;
  const final=1+(Math.random()*10|0),ok=final<=N;let k=0;const delays=[50,50,55,60,65,75,85,100,120,145,175,210,250];
  const tick=()=>{if(k<delays.length){die.textContent=1+(Math.random()*10|0);sfx('tick');setTimeout(tick,delays[k++]);}
    else{die.textContent=final;die.className='die '+(ok?'win':'lose');txt.textContent=ok?`${final} : il est à toi !`:`${final} : raté, il file.`;
      setTimeout(()=>{$('#dice').hidden=true;if(ok)landed();else lost(null);},900);}};
  tick();
}
function lost(msg){G.boss=null;G.jump=null;if(msg)toast(msg);sfx('fail');splash(G.bob.x,WY(),6);startReel();save();renderPanel();updStats();}
function catchFish(){
  setMode('result');$('#mg').hidden=true;sfx('win');
  const f=G.pick,fish=makeFish(f,tech()==='traine'||!!BOSS[f.id]),{w,l,v}=fish;
  const d=S.dex[f.id],first=!d,rec=!d||w>d.best;S.dex[f.id]={n:(d?d.n:0)+1,best:Math.max(d?d.best:0,w)};S.stats.caught++;
  S.top.push({id:f.id,w,l});S.top.sort((a,b)=>b.w-a.w);S.top=S.top.slice(0,8);
  onCatch(f,fish);
  const ev=evActive();let conc='';if(ev&&ev.type==='concours'&&ev.spot===S.loc){if(!ev.best||w>ev.best.w){ev.best={sp:f.id,w,v};conc='<span class="badge gold">En tête du concours</span>';}}
  const full=S.fish.length>=coolCap();
  const el=$('#catch');el.innerHTML='';const card=document.createElement('div');card.className='card';
  card.append(sprEl(f.id,Math.max(4,Math.min(9,Math.floor(230/SPR[f.id].lw)))));
  const cheap=full?S.fish.reduce((a,b)=>price(a,'gros')<=price(b,'gros')?a:b):null;
  const pen=ev&&ev.type==='penurie'&&ev.sp===f.id?1.8:1;
  card.insertAdjacentHTML('beforeend',`<h2>${f.n}</h2>
    <div class="badges"><span class="tag" style="color:${RAR[f.r].c}">${RAR[f.r].n}</span>${first?'<span class="badge">Nouvelle espèce</span>':''}${rec&&!first?'<span class="badge">Record perso</span>':''}${conc}</div>
    <div class="cstats"><div><small>Poids</small><b>${fmtW(w)}</b></div><div><small>Taille</small><b>${l} cm</b></div><div><small>Grossiste</small><b>${fmt(v*.5*pen)}</b></div><div><small>Marché</small><b>${fmt(v*pen)}</b></div><div><small>Poissonnerie</small><b style="color:var(--gold)">${fmt(v*1.5*pen)}</b></div></div>
    <div class="row">${full?`<button class="btn main" id="cRep">Remplacer ${FBY[cheap.sp].n} (${fmt(price(cheap,'gros'))})</button>`:'<button class="btn main" id="cKeep">Mettre en glacière</button>'}<button class="btn" id="cRel">Relâcher</button></div>
    ${full?'<p class="why">Glacière pleine.</p>':''}`);
  el.append(card);el.hidden=false;
  const done=()=>{el.hidden=true;save();G.bob={x:0,y:0};setMode('idle');renderAll();checkDayEnd();};
  if(full)$('#cRep').onclick=()=>{S.fish.splice(S.fish.indexOf(cheap),1,fish);toast(`${f.n} remplace ${FBY[cheap.sp].n}.`);done();};
  else $('#cKeep').onclick=()=>{S.fish.push(fish);done();};
  $('#cRel').onclick=()=>{toast(`${f.n} relâché.`);done();};
  (full?$('#cRep'):$('#cKeep')).focus();
}

const modalOpen=()=>!$('#modal').hidden;
function press(){if(modalOpen()||!$('#catch').hidden)return;if(S.view!=='place'||!isSpot())return;if(G.mode==='idle')cast();else if(G.mode==='mg')stopMG();else if(G.mode==='aim')aimDrop();else if(G.mode==='retrieve')retrievePress();else if(G.mode==='feint')feintFail();}
cv.addEventListener('pointerdown',e=>{if(S.view==='place'&&isSpot()){e.preventDefault();press();}});
window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat)return;const t=e.target&&e.target.tagName;if(t==='BUTTON'||t==='INPUT'||t==='SELECT')return;if(modalOpen())return;if(S.view==='place'&&isSpot()){e.preventDefault();press();}});
$('#mute').onclick=()=>{S.muted=!S.muted;save();updStats();if(!S.muted)sfx('coin');};

function sellGros(){const n=S.fish.length;if(!n)return;let sum=0;S.fish.forEach(f=>sum+=price(f,'gros'));S.money+=sum;S.stats.gros+=n;S.stats.earned+=sum;S.fish=[];advance(30);sfx('cash');toast(`Grossiste : ${n} poisson${n>1?'s':''} vendus, +${fmt(sum)}.`);renderAll();checkDayEnd();}
function holdStand(tid){const p=simSell(S.fish,tid,marketDemand(tid));if(!p.list.length)return;p.list.forEach(f=>S.fish.splice(S.fish.indexOf(f),1));S.sat[tid]=p.tmp;S.money+=p.sum;S.stats.earned+=p.sum;S.marketDay[tid]=S.day;skGain('negoce',p.list.length/3);advance(180);sfx('cash');toast(`Marché : ${p.list.length} poissons vendus, +${fmt(p.sum)}.`);renderAll();checkDayEnd();}
function restock(tid){const sh=S.shops[tid],room=stockCap(tid)-sh.stock.length;if(room<=0||!S.fish.length)return;
  const list=[...S.fish].sort((a,b)=>b.d-a.d||b.v-a.v).slice(0,room);list.forEach(f=>{S.fish.splice(S.fish.indexOf(f),1);sh.stock.push(f);});advance(30);sfx('coin');toast(`${list.length} poissons déposés en boutique.`);renderAll();checkDayEnd();}
function deliverOrder(id){const o=S.contracts.find(c=>c.id===id);if(!o||o.tid!==S.loc)return;const m=S.fish.filter(f=>f.sp===o.sp).sort((a,b)=>a.v-b.v);if(m.length<o.qty)return;
  m.slice(0,o.qty).forEach(f=>S.fish.splice(S.fish.indexOf(f),1));S.money+=o.reward;S.stats.earned+=o.reward;S.stats.orders++;S.contracts=S.contracts.filter(c=>c!==o);skGain('negoce',3);sfx('cash');setTimeout(()=>sfx('win'),250);toast(`Contrat livré : +${fmt(o.reward)}.`);renderAll();}
function travelInfo(to){const A=LOC[S.loc],B=LOC[to],d=Math.hypot(B.x-A.x,B.y-A.y);return{m:Math.max(15,Math.round(d/15)*15),cost:Math.round(d*.2),d};}
function travel(to){const t=travelInfo(to);S.money-=t.cost;resetFishing();G.travel={a:LOC[S.loc],b:LOC[to],t:0,d:Math.min(1.6,.5+t.d/200),to,m:t.m};input.busy=true;sfx('travel');renderAll();}
function arrive(){const T=G.travel;G.travel=null;input.busy=false;S.loc=T.to;S.view='place';S.mapSel=null;advance(T.m);toast(`Arrivée : ${LOC[S.loc].n}.`);tabTo('ici');renderAll();}

/* ================= TECHNIQUES, OBSERVER, MARÉES ================= */
const TECHN={pose:'Au posé',leurre:'Au leurre',mouche:'À la mouche',traine:'À la traîne'};
const TECHD={pose:'Tu attends que ça morde.',leurre:'Clique en rythme pour ramener le leurre à la bonne vitesse.',mouche:'Pose ta mouche dans le remous : un lancer à côté ne prend rien.',traine:'Touches plus rares, mais poissons plus gros.'};
function tech(){if(S.loc==='large')return'traine';if(S.bait==='mouche')return'mouche';if(S.bait==='leurre')return'leurre';return'pose';}
function tideLevel(){return Math.sin((S.day*1440+S.min)/360*Math.PI*2);}
function tideHigh(){return tideLevel()>=0;}
function tideText(){const hi=tideHigh(),tot=S.day*1440+S.min,next=180-(tot%180);return`Marée ${hi?'haute':'basse'} · change dans ${dur(Math.round(next/15)*15||15)}`;}
function migrK(f){const m=MIGR[f.id];return m&&m.s===season()?m.k:1;}
function launch(x){sfx('cast');const tip=rodTip();G.cast={t:0,x0:tip.x,y0:tip.y+10,x1:x,y1:WY()+1};setMode('casting');}
function afterLanding(){
  if(G.miss){G.miss=false;toast('À côté du remous : rien ne monte.',2200);startReel();return;}
  if(tech()==='leurre'){startRetrieve();return;}
  setupWait();
}
/* Visée de la mouche */
function aimX(){return 120+(Math.sin(G.aim.t*1.7)*.5+.5)*190;}
function startAim(){G.aim={t:0,rx:150+Math.random()*130};$('#techT').textContent='À la mouche';$('#techS').textContent='Clique ou appuie sur Espace quand le repère est dans le remous.';$('#tbar').hidden=true;setMode('aim');}
function stepAim(dt){G.aim.t+=dt;G.aim.rx+=Math.sin(G.aim.t*.8)*dt*5;}
function aimDrop(){const x=aimX();G.miss=Math.abs(x-G.aim.rx)>11;G.aim=null;launch(x);}
/* Ramenée au leurre */
function startRetrieve(){G.ret={v:.12,ok:0,t:0};$('#techT').textContent='Au leurre';$('#techS').textContent='Clique ou appuie sur Espace en rythme, sans sortir de la bande verte.';$('#tbar').hidden=false;setMode('retrieve');}
function retrievePress(){if(G.ret){G.ret.v=Math.min(1,G.ret.v+.15);sfx('tick');}}
function stepRetrieve(dt){const R0=G.ret;if(!R0)return;R0.t+=dt;R0.v=Math.max(0,R0.v-.42*dt);if(R0.v>=.42&&R0.v<=.72)R0.ok+=dt;G.bob.x=Math.max(90,G.bob.x-(3+R0.v*14)*dt);G.bob.y=WY()+1;$('#tcur').style.left=(R0.v*100)+'%';
  if(R0.ok>=1.6){G.ret=null;G.quick=true;$('#tech').hidden=true;setupWait();}
  else if(R0.t>8){G.ret=null;toast('Le leurre ne convainc personne.',2200);startReel();}}
/* Fausse touche des espèces rusées */
function needsFeint(){return!G.feinted&&BEH[behav(G.pick)].feint;}
function startFeint(){G.feinted=true;G.feintT=0;G.feintD=.9+Math.random()*1;splash(G.bob.x,WY(),3);ripple(G.bob.x,WY()+1,5);sfx('nibble');setMode('feint');toast('Une touche… ou pas ?',900);}
function feintFail(){S.baits[S.bait]=Math.max(0,S.baits[S.bait]-1);lost('Trop tôt : c’était une fausse touche, il a filé.');}
/* Observer */
const CLUES={lourd:'De grosses bulles remontent lentement du fond.',nerveux:'Des rides vives courent à la surface.',fuyard:'Des oiseaux plongent plus loin : ça chasse.',ruse:'Un remous discret près du bord, puis plus rien.',paisible:'De petits ronds calmes troublent l’eau.'};
function oeilLv(){return skLv('oeil');}
function clueText(f){let t=CLUES[behav(f)];if(f.r>=3)t+=' Une brume épaisse flotte sur ce coin.';const lv=oeilLv();if(lv>=2)t+=f.r>=3?' Sans doute une très belle prise.':(f.r===2?' Un poisson de bonne taille.':' Plutôt du menu fretin.');if(lv>=4)t+=` Ça ressemble à : ${f.n}.`;return t;}
function observe(){const c=FISH.filter(f=>f.s===S.loc&&!(BOSS[f.id]&&S.bosses[f.id])&&inSeason(f)&&(!f.hours||f.hours.some(w=>inH(hour(),w)))&&(!f.wx||under()||f.wx.includes(S.weather))&&(!f.tide||tideHigh())),f=pickFrom(c);
  advance(15);sfx('nibble');onObserve();
  if(f){S.obs={spot:S.loc,sp:f.id,txt:clueText(f)};S.hints[f.id]=true;}else S.obs={spot:S.loc,sp:null,txt:'L’eau est immobile. Rien ne bouge à cette heure.'};
  if(!f)S.obs.sp=FISH.find(x=>x.s===S.loc).id;
  save();renderAll();checkDayEnd();}
function onObserve(){skGain('oeil',2);}
function spotExtra(){const t=tech();let h=`<div class="sec"><h3>Technique</h3><div class="box"><span><b>${TECHN[t]}</b> · ${TECHD[t]}</span>${TIDAL.includes(S.loc)?`<span>${tideText()}</span>`:''}</div></div>`;
  if(S.obs&&S.obs.spot===S.loc)h+=`<div class="sec"><h3>Ce que tu as vu</h3><div class="box hot"><span>${S.obs.txt}</span></div></div>`;
  return h+questBox();}
function newsExtra(items){rivalNews(items);const mig=Object.values(MIGR).filter(m=>m.s===season());mig.forEach(m=>items.push(`<li class="sea"><b>Migration</b><span>${m.t.replace('Migration : ','')}</span></li>`));
  if(S.view==='place'&&TIDAL.includes(S.loc))items.push(`<li class="pay"><b>Marée</b><span>${tideText()}. Certaines espèces ne mordent qu’à marée haute.</span></li>`);}
function drawTechFx(wy,pal){
  drawHorizon(wy);
  drawJump(wy);
  if(TIDAL.includes(S.loc)&&S.loc!=='large'){const lv=tideLevel(),a=clamp01(-lv);if(a>0){ctx.globalAlpha=a*.9;ctx.fillStyle=linG(ctx,0,wy,0,wy+6,'#b9a77e','#8a7a58');[[175,wy+3,62,3.2],[275,wy+1.5,38,2]].forEach(([x,y,rx,ry])=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry*a+.4,0,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}}
  if(G.mode==='aim'&&G.aim){const rx=G.aim.rx,y=wy+3;ctx.strokeStyle='#ffffff';for(let k=0;k<3;k++){const ph=(G.t*.9+k/3)%1;ctx.globalAlpha=(1-ph)*.85;ctx.lineWidth=.45;ctx.beginPath();ctx.ellipse(rx,y,3+ph*9,.9+ph*2.2,0,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;
    const x=aimX();ctx.strokeStyle='#f6cc56';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x,y+3);ctx.stroke();ell(ctx,x,y-6.5,1.2,1.2,'#f6cc56');}
}

/* ================= COMPÉTENCES ================= */
const SKILLS={
  patience:{n:'Patience',up:'Poissons paisibles et lourds',eff:'Zone verte plus large'},
  main:{n:'Main',up:'Poissons nerveux et fuyards',eff:'Curseur plus lent'},
  oeil:{n:'Œil',up:'Observer, lire le carnet',eff:'Indices plus précis'},
  negoce:{n:'Négoce',up:'Ventes au stand et en boutique',eff:'Meilleur prix, meilleur contrat'}
};
const SKX=[0,10,30,70,150];
function skLv(k){const x=S.skills[k]||0;let l=1;for(let i=1;i<5;i++)if(x>=SKX[i])l=i+1;return l;}
function skGain(k,n){const a=skLv(k);S.skills[k]=(S.skills[k]||0)+n;const b=skLv(k);if(b>a)toast(`${SKILLS[k].n} passe au niveau ${b} !`,2600);}
function negK(ch){let m=1;if(ch==='shop'&&S.ending==='comptoir')m*=1.1;if(ch==='shop'&&S.fx.exclUntil>=S.day)m*=.9;if(ch==='shop'&&S.fx.warUntil>=S.day)m*=.9;if(ch!=='gros')m*=1+.02*(skLv('negoce')-1);if(S.bosses.koi)m*=1.05;return m;}
function skillsHtml(){return`<div class="sec"><h3>Compétences</h3><div class="skills">${Object.entries(SKILLS).map(([k,s])=>{const l=skLv(k),x=S.skills[k]||0,a=SKX[l-1],z=SKX[l]||a+1,pc=l>=5?100:Math.round((x-a)/(z-a)*100);return`<div class="skill"><span class="sn"><b>${s.n}</b><span>niveau ${l}/5</span></span><div class="sg"><i style="width:${pc}%"></i></div><small>${s.eff}. Monte avec : ${s.up.toLowerCase()}.</small></div>`;}).join('')}</div></div>`;}

function landed(){if(G.boss&&G.boss.phase<2){G.boss.phase++;bossNext();return;}catchFish();}
function bossNext(){const id=G.pick.id;toast(`Phase ${G.boss.phase+1}/3 : il repart !`,1800);sfx('bite');splash(G.bob.x,WY(),8);ripple(G.bob.x,WY()+1,9);G.mg=null;
  if(id==='leviathan'){G.feinted=true;startFeint();return;}
  if(id==='saumon'){G.jump={t0:G.t};sfx('splash');G.biteT=-1.1;}else G.biteT=-.4;
  setMode('bite');}
function drawJump(wy){const J=G.jump;if(!J||!G.pick)return;const k=(G.t-J.t0)/1;if(k>=1){G.jump=null;splash(G.bob.x+16,wy,8);ripple(G.bob.x+16,wy+1,8);return;}
  const s=SPR[G.pick.id],x=G.bob.x-16+32*k,y=wy-Math.sin(Math.PI*k)*28,sc=.6;ctx.save();ctx.translate(x,y);ctx.rotate((k-.5)*1.6);ctx.scale(-1,1);ctx.drawImage(s,-s.lw*sc/2,-s.lh*sc/2,s.lw*sc,s.lh*sc);ctx.restore();}
function drawShopExtra(id,base){const bs=Object.keys(S.bosses);if(!S.shops[id]||!bs.length)return;const sx=176;
  bs.forEach((b,i)=>{const x=sx+47.4,y=base-22+i*4.1;ctx.fillStyle='#7a5433';ctx.fillRect(x,y,6.4,3.5);ctx.strokeStyle='#e6c76a';ctx.lineWidth=.2;ctx.strokeRect(x,y,6.4,3.5);const s=SPR[b],k=Math.min(5.6/s.lw,2.8/s.lh);ctx.drawImage(s,x+3.2-s.lw*k/2,y+1.75-s.lh*k/2,s.lw*k,s.lh*k);});}

const QUESTS={
  vieillecarpe:{spot:'etang',n:'La Vieille Carpe',d:'Attrape une carpe miroir de plus de 10 kg, avant midi.',r:'20 vers et une page du carnet',gift(){S.baits.ver+=20;}},
  eclusier:{spot:'canal',n:'L’éclusier',d:'L’éclusier répare son écluse et demande qu’on lui prête trois espèces différentes.',r:'Le prochain permis à moitié prix et une page du carnet',gift(){S.permitDisc=true;}},
  gue:{spot:'riviere',n:'Le gué de Marcel',d:'Attrape une truite fario au leurre, à l’aube (avant 8 h), sans la perdre.',r:'10 leurres et une page du carnet',gift(){S.baits.leurre+=10;}},
  equinoxe:{spot:'estuaire',n:'Marée d’équinoxe',d:'Attrape cinq poissons pendant une seule marée haute.',r:'30 crevettes, 500 € et une page du carnet',gift(){S.baits.crevette+=30;S.money+=500;S.stats.earned+=500;}},
  phare:{spot:'cote',n:'Le phare',d:'Attrape un congre de nuit (après 21 h), sous les yeux du gardien.',r:'La lanterne du gardien : la nuit, les poissons rares mordent plus souvent. Et une page du carnet',gift(){S.lantern=true;}}
};
function questDone(id){if(S.quests[id])return;const q=QUESTS[id];S.quests[id]=S.day;q.gift();addPage('q_'+id);secretFrom(id);sfx('win');notify('Quête accomplie',q.n,`<p>${PAGES['q_'+id].txt}</p><p class="why">Récompense : ${q.r}.</p>`);}
function questOnCatch(f,fish){
  if(f.id==='carpe'&&S.loc==='etang'&&fish.w>10&&hour()<12)questDone('vieillecarpe');
  if(f.id==='truite'&&S.loc==='riviere'&&tech()==='leurre'&&hour()<8)questDone('gue');
  if(f.id==='congre'&&S.loc==='cote'&&hour()>=21)questDone('phare');
  if(S.loc==='estuaire'&&tideHigh()&&!S.quests.equinoxe){const t=Math.floor((S.day*1440+S.min)/360);if(S.qd.tide!==t){S.qd.tide=t;S.qd.n=0;}S.qd.n++;if(S.qd.n>=5)questDone('equinoxe');}
}
function onCatch(f,fish){const b=behav(f);if(b==='paisible'||b==='lourd')skGain('patience',1);if(b==='nerveux'||b==='fuyard')skGain('main',1);
  if(BOSS[f.id]&&!S.bosses[f.id]){const B=BOSS[f.id];S.bosses[f.id]=S.day;if(B.gift)B.gift();addPage('b_'+f.id);secretFrom(f.id);notify('Trophée',f.n,`<p>${PAGES['b_'+f.id].txt}</p><p class="why">Il rejoint tes boutiques en trophée. ${B.perk}</p>`);}
  questOnCatch(f,fish);G.boss=null;}
function lendSpecies(){const m={};[...S.fish].sort((a,b)=>a.v-b.v).forEach(f=>{if(!m[f.sp])m[f.sp]=f;});return Object.values(m).slice(0,3);}
function lendEclusier(){const L0=lendSpecies();if(L0.length<3||S.quests.eclusier)return;L0.forEach(f=>S.fish.splice(S.fish.indexOf(f),1));questDone('eclusier');save();renderAll();}
function questBox(){let h='';
  const qe=Object.entries(QUESTS).find(([,q])=>q.spot===S.loc);
  if(qe){const[id,q]=qe,done=S.quests[id];let x='';if(!done&&id==='equinoxe'){const t=Math.floor((S.day*1440+S.min)/360);x=`<span>Cette marée : ${S.qd.tide===t?S.qd.n:0} / 5.</span>`;}
    if(!done&&id==='eclusier'){const n=new Set(S.fish.map(f=>f.sp)).size;x=`<span>Espèces différentes en glacière : ${Math.min(n,3)} / 3.</span>`;}
    h+=`<div class="sec"><h3>Quête du lieu</h3><div class="box${done?'':' quest'}"><b>${q.n}</b><span>${done?'Accomplie.':q.d}</span>${done?'':`<span class="why">${q.r}.</span>`}${x}</div>${!done&&id==='eclusier'?`<button class="btn go" data-act="lend" ${lendSpecies().length<3?'disabled':''}>Prêter trois espèces</button>`:''}</div>`;}
  const be=Object.entries(BOSS).find(([,b])=>b.spot===S.loc);
  if(be){const[id,b]=be,done=S.bosses[id],know=S.dex[id]||S.hints[id];
    h+=`<div class="sec"><h3>Le maître des lieux</h3><div class="box${done?'':' quest'}"><b>${know||done?FBY[id].n:'Quelque chose de très gros'}</b><span>${done?`Pêché le jour ${done}. Il trône dans tes boutiques.`:(know?`${b.how} ${b.fight} Trois phases, une seule fois par partie.`:'Observe l’eau et lis le carnet pour savoir quand le trouver.')}</span></div></div>`;}
  return h;}

let last=performance.now(),secT=0;
function step(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;
  if(S.view==='place'&&isSpot()&&!under()&&S.weather==='orage'){G.flashNext-=dt;if(G.flashNext<=0){G.flash=.12;G.flashNext=5+Math.random()*9;}}

  RAIN.forEach(d=>{d.y+=d.sp*dt;d.x-=d.sp*dt*.3;if(d.y>H){d.y=-4;d.x=Math.random()*(W+40);if(S.view==='place'&&isSpot()&&(S.weather==='pluie'||S.weather==='orage')&&Math.random()<.08)ripple(d.x,WY()+4+Math.random()*60,3);}if(d.x<0)d.x+=W;});
  G.parts.forEach(q=>{q.vy+=140*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;});G.parts=G.parts.filter(q=>q.life>0&&(S.view!=='place'||!isSpot()||q.y<WY()+2));
  G.rips.forEach(r=>{r.r+=dt*10;r.life-=dt*1.4;});G.rips=G.rips.filter(r=>r.life>0);
  if(G.travel){G.travel.t+=dt;if(G.travel.t>=G.travel.d)arrive();}
  if(S.view==='place'&&isSpot()){
    if(G.mode==='casting'){const c=G.cast;c.t+=dt/.7;const t=Math.min(1,c.t);G.bob.x=c.x0+(c.x1-c.x0)*t;G.bob.y=c.y0+(c.y1-c.y0)*t-Math.sin(Math.PI*t)*40;if(t>=1){splash(c.x1,WY(),5);ripple(c.x1,WY()+1,6);sfx('splash');afterLanding();}}
    else if(G.mode==='aim'){stepAim(dt);}
    else if(G.mode==='retrieve'){stepRetrieve(dt);}
    else if(G.mode==='feint'){G.feintT+=dt;if(G.feintT>=G.feintD){G.biteT=0;splash(G.bob.x,WY(),6);ripple(G.bob.x,WY()+1,7);sfx('bite');setMode('bite');toast('Ça mord !',900);}}
    else if(G.mode==='waiting'){G.wait+=dt;G.bob.y=WY()+1+Math.round(Math.sin(G.t*2.2)*.6);if(G.nib>0)G.nib-=dt;
      while(G.nibbles.length&&G.wait>=G.nibbles[0]){G.nibbles.shift();G.nib=.28;ripple(G.bob.x,WY()+1,4);sfx('nibble');}
      if(G.pick&&G.wait>=G.biteAt&&needsFeint()){startFeint();}
      else if(G.pick&&G.wait>=G.biteAt){G.biteT=0;splash(G.bob.x,WY(),6);ripple(G.bob.x,WY()+1,7);sfx('bite');setMode('bite');toast('Ça mord !',900);}
      else if(!G.pick&&G.wait>3.4){toast('Rien ne mord. Change d’appât ou reviens à une autre heure.',2800);startReel();renderAll();checkDayEnd();}}
    else if(G.mode==='bite'){G.biteT+=dt;if(G.biteT>.45)startMG();}
    else if(G.mode==='mg'){const M=G.mg;if(!M.stopped){M.pos+=M.dir*M.speed*dt;if(M.pos>=1){M.pos=1;M.dir=-1;}if(M.pos<=0){M.pos=0;M.dir=1;}moveZone(M,dt);}$('#cursor').style.left=(M.pos*100)+'%';if(Math.random()<dt*3)splash(G.bob.x+Math.sin(G.t*5)*3,WY(),2);}
    else if(G.mode==='reeling'){G.reel.t+=dt/.45;const t=Math.min(1,G.reel.t),tip=rodTip();G.bob.x=G.reel.x+(tip.x-G.reel.x)*t;G.bob.y=G.reel.y+(tip.y+10-G.reel.y)*t-Math.sin(Math.PI*t)*8;if(t>=1){setMode('idle');if(tab==='ici')renderPanel();checkDayEnd();}}
  }
  if(S.view==='map')drawMap();else if(isSpot())drawSpot();else drawTown();
  secT+=dt;if(secT>1){secT=0;if(tab==='ici'&&S.view==='place'&&isSpot())updActive();}
  requestAnimationFrame(step);
}

  <div class="flist" id="flist"></div>`;
  const fl=$('#flist');if(!list.length){fl.innerHTML='<p class="empty">Glacière vide. Va pêcher !</p>';return;}
  list.forEach(f=>{const F=FBY[f.sp],row=document.createElement('div');row.className='frow';row.append(sprEl(f.sp,2));
    row.insertAdjacentHTML('beforeend',`<div>${F.n}${freshTag(f)}<small>${fmtW(f.w)} · <span style="color:${RAR[F.r].c}">${RAR[F.r].n}</span>${inTown&&FAV[inTown].includes(f.sp)?' · <span class="good">recherché ici</span>':''}</small></div><div class="pr">Gros. ${fmt(price(f,'gros'))}<br>Marché <b>${fmt(price(f,'marche',inTown))}</b></div>`);fl.append(row);});
}
function renderAff(){
  const i=GOALS.findIndex(g=>!g.ok());
  let h=`<div class="sec"><h3>Objectifs</h3><ul class="goals">${GOALS.map((g,k)=>`<li class="${g.ok()?'done':k===i?'cur':''}">${g.t}</li>`).join('')}</ul></div>`;
  if(S.contracts.length)h+=`<div class="sec"><h3>Contrats · ${S.contracts.length}/2</h3>${S.contracts.map(o=>`<div class="box hot"><span>${ordText(o)}.</span></div><button class="btn c" data-act="drop-order" data-id="${o.id}">Refuser ce contrat</button>`).join('')}</div>`;
  h+=skillsHtml();const st=Object.keys(S.stands);h+=`<div class="sec"><h3>Stands au marché · ${st.length}</h3>${st.length?`<div class="kv">${st.map(t=>`<div><span>${TOWNS[t].n}</span><span>${S.marketDay[t]===S.day?'tenu aujourd’hui':'disponible'}</span></div>`).join('')}</div>`:'<p class="empty">Aucun stand. Le premier coûte 800 € dans un village.</p>'}</div>`;
  const sh=Object.entries(S.shops);let ch=0;sh.forEach(([t])=>ch+=SIZE[TOWNS[t].size].charge);
  h+=`<div class="sec"><h3>Poissonneries · ${sh.length}/7</h3>${sh.length?`<div class="kv">${sh.map(([t,s])=>`<div><span>${TOWNS[t].n}</span><span>stock ${s.stock.length}/${stockCap(t)}${s.last!=null?` · hier ${fmt(s.last)}`:''}</span></div>`).join('')}<div><span>Charges totales</span><span>${fmt(ch)} / jour</span></div></div>`:'<p class="empty">Aucune poissonnerie pour l’instant.</p>'}</div>`;
  h+=`<div class="sec"><h3>Employés · ${S.staff.length}</h3>${S.staff.length?`<div class="kv">${S.staff.map(s=>`<div><span>${s.name} · ${STAFF[s.type].n.toLowerCase()} · ${TOWNS[s.shop].n}${s.spot?` · ${SPOTS[s.spot].n}`:''}</span><span>${fmt(s.wage)}/sem.</span></div>`).join('')}<div><span>Paie à la fin du jour ${nextPayday()}</span><span>${fmt(wagesTotal())}</span></div></div>`:'<p class="empty">Personne pour l’instant. On embauche depuis une de ses poissonneries.</p>'}</div>`;
  h+=`<div class="sec"><h3>Carnet</h3><div class="kv"><div><span>Poissons pêchés</span><span>${S.stats.caught}</span></div><div><span>Commandes livrées</span><span>${S.stats.orders}</span></div><div><span>Gains totaux</span><span>${fmt(S.stats.earned)}</span></div><div><span>Permis</span><span>${Object.keys(S.permits).length} / ${Object.keys(SPOTS).length}</span></div></div></div>`;
  h+=`<button class="btn red" data-act="reset">Effacer la sauvegarde</button>`;
  pane.innerHTML=h;
}
function carnetSpecies(f,d){return d?`<span class="dc"><b>${BEH[behav(f)].n}</b> : ${BEH[behav(f)].tip}</span>`:'';}
function permitCost(k){let c=SPOTS[k].permit;if(S.ending==='large')c=Math.round(c*.75);if(k==='large'&&S.choices.gaspard==='refus')c=Math.round(c*.8);if(S.permitDisc)c=Math.ceil(c/2);return c;}
function renderDex(){if(S.dexRead!==S.day){S.dexRead=S.day;skGain('oeil',1);}
  const got=FISH.filter(f=>S.dex[f.id]).length,pct=Math.round(got/FISH.length*100);
  pane.innerHTML=`<div class="ph"><h2>Le carnet</h2><span>${got} / ${FISH.length} pages remplies · ${pct} %</span></div>
  ${carnetTop()}
  ${Object.entries(SPOTS).map(([z,Z])=>`<div class="sec"><h3>${Z.n}${S.permits[z]?'':' · permis '+fmt(permitCost(z))}</h3><div class="dex" data-z="${z}"></div></div>`).join('')}
  <div class="sec"><h3>Plus grosses prises</h3>${S.top.length?`<ol class="steps">${S.top.map(t=>`<li>${FBY[t.id].n} · ${fmtW(t.w)} · ${t.l} cm</li>`).join('')}</ol>`:'<p class="empty">Rien encore.</p>'}</div>${carnetBottom()}`;
  FISH.forEach(f=>{const d=S.dex[f.id],known=d||S.hints[f.id],box=pane.querySelector(`.dex[data-z="${f.s}"]`),c=document.createElement('div');c.className='dcard';c.append(sprEl(f.id,3,!d));
    c.insertAdjacentHTML('beforeend',`<span class="dn">${d?f.n:(S.hints[f.id]?f.n+' ?':'Page vierge')}</span><span class="tag" style="color:${RAR[f.r].c};justify-self:start">${RAR[f.r].n}</span>${known?`<span class="dc">${condText(f)}</span>${!inSeason(f)?'<span class="bad" style="font-size:12px">Fermé cette saison</span>':''}`:'<span class="dc">Pêche-le ou observe l’eau pour noter ses habitudes.</span>'}${d?`<span class="dc">Valeur ${fmt(f.v[0])}–${fmt(f.v[1])}</span><span>Record ${fmtW(d.best)} · ${d.n} prise${d.n>1?'s':''}</span>`:''}${carnetSpecies(f,d)}`);box.append(c);});
}

/* ---------- Actions du panneau ---------- */
let armed=null;
function pay(p){if(S.money<p)return false;S.money-=p;sfx('coin');return true;}
pane.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled||input.busy)return;const act=b.dataset.act,id=b.dataset.id,tid=S.loc;
  const fishingBusy=S.view==='place'&&isSpot()&&G.mode!=='idle';
  if(act==='bait'){if(fishingBusy){toast('Attends la fin de ce lancer.');return;}S.bait=id;}
  else if(act==='cast'){cast();}
  else if(act==='map'){if(fishingBusy){toast('Attends la fin de ce lancer.');return;}S.view='map';S.mapSel=null;}
  else if(act==='back'){S.view='place';S.mapSel=null;}
  else if(act==='travel'){travel(id);return;}
  else if(act==='permit'){const s=SPOTS[id],c0=permitCost(id);if(SPOTCH[id]<=S.chapter&&pay(c0)){S.permits[id]=true;S.permitDisc=false;toast(`Permis acheté : ${s.n}.`);}}
  else if(act==='sleep'){if(fishingBusy)return;if(armed!=='sleep'){armed='sleep';b.textContent=`Confirmer : finir le jour ${S.day} à ${hhmm(S.min)}`;setTimeout(()=>{if(armed==='sleep'){armed=null;renderPanel();}},3000);return;}armed=null;endDay();return;}
  else if(act==='observe'){if(fishingBusy)return;observe();return;}
  else if(act==='lend'){if(fishingBusy)return;lendEclusier();return;}
  else if(act==='work'){atelierRun(tid,id);return;}
  else if(act==='gros'){sellGros();return;}
  else if(act==='stand'){holdStand(tid);return;}
  else if(act==='stand-buy'){const Z=SIZE[TOWNS[tid].size];if(pay(Z.stand)){S.stands[tid]=true;toast(`Stand loué à ${TOWNS[tid].n}.`);}}
  else if(act==='tranche'){buyTranche();return;}
  else if(act==='shop-buy'){const Z=SIZE[TOWNS[tid].size];if(canNetwork(tid)&&pay(Z.shop)){S.shops[tid]={stock:[],last:null,lastN:0,up:{}};sfx('win');toast(`Poissonnerie ouverte à ${TOWNS[tid].n} !`);}}
  else if(act==='restock'){restock(tid);return;}
  else if(act==='upg'){if(pay(upCost(tid,id))){S.shops[tid].up[id]=true;toast(`${UPG[id].n} installée.`);}}
  else if(act==='hire-v'){const nm=pick(NAMES),tr=pick(TK);S.staff.push({id:'e'+(S.nextId++),type:'vendeur',name:nm,trait:tr,shop:tid,wage:traitWage(STAFF.vendeur.wage,tr),hired:S.day});sfx('coin');toast(`${nm} rejoint l’équipe à la vente (${TRAITS[tr].n}).`);}
  else if(act==='hire-p'){const sp=($('#hireSpot')||{}).value;if(!sp||!S.permits[sp])return;const nm=pick(NAMES),tr=pick(TK);S.staff.push({id:'e'+(S.nextId++),type:'pecheur',name:nm,trait:tr,shop:tid,spot:sp,wage:traitWage(STAFF.pecheur.wage,tr),hired:S.day,last:null});sfx('coin');toast(`${nm} pêchera à ${SPOTS[sp].n} (${TRAITS[tr].n}).`);}
  else if(act==='fire'){const s=S.staff.find(x=>x.id===id);if(!s)return;if(armed!=='fire'+id){armed='fire'+id;b.textContent='Confirmer';setTimeout(()=>{if(armed==='fire'+id){armed=null;renderPanel();}},3000);return;}armed=null;S.staff=S.staff.filter(x=>x.id!==id);toast(`${s.name} a été renvoyé.`);}
  else if(act==='deliver'){deliverOrder(id);return;}
  else if(act==='drop-order'){S.contracts=S.contracts.filter(c=>c.id!==id);toast('Contrat refusé.');}
  else if(act==='buybait'){const B=BAITS[id];if(pay(B.price)){S.baits[id]+=B.pack;toast(`+${B.pack} ${B.n.toLowerCase()}.`);}}
  else if(act==='rod'){const x=RODS[+id];if(pay(x.price)){S.rod=+id;toast(`${x.n} achetée.`);}}
  else if(act==='reel'){const x=REELS[+id];if(pay(x.price)){S.reel=+id;toast(`${x.n} monté.`);}}
  else if(act==='cooler'){const x=COOLERS[+id];if(pay(x.price)){S.cooler=+id;toast(`${x.n} achetée.`);}}
  else if(act==='boat'){if(pay(BOAT.price)){S.boat=true;toast('Bateau acheté. La haute mer t’attend.');}}
  else if(act==='reset'){if(armed!=='reset'){armed='reset';b.textContent='Confirmer : tout effacer';setTimeout(()=>{if(armed==='reset'){armed=null;renderPanel();}},3000);return;}
    armed=null;const mu=S.muted;try{localStorage.removeItem(SAVE);}catch(err){}S=fresh();S.muted=mu;resetFishing();tabTo('ici');renderAll();showIntro();return;}
  save();renderAll();
});

/* ---------- Modales ---------- */
function openModal(html){$('#mcard').innerHTML=html;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;renderAll();}
function showIntro(){
  openModal(`<span class="ey">Nouvelle partie</span><h2>Le bouchon d’Anselme</h2>
  <p>Ton grand-père Anselme Laroche, pêcheur et poissonnier connu de toute la région, a disparu en mer. Il te laisse une vieille canne en bambou, un bouchon rouge et blanc gravé A. L., un carnet aux pages arrachées et une poissonnerie saisie à Saint-Aubin.</p>
  <p>Tu as 40 € et un étang gratuit. On pêche, on vend, on réinvestit :</p>
  <ol class="steps">
    <li><b>Grossiste</b> : tout se vend à moitié prix à Saint-Aubin.</li>
    <li><b>Stand au marché</b> : dès 300 €, prix plein, quantité limitée, et le prix baisse si tu vends trop la même espèce.</li>
    <li><b>Boutique familiale</b> : 4 000 € en quatre tranches, payées quand tu veux. Elle vend à 150 % dès sa réouverture.</li>
    <li><b>Réseau</b> : d’autres boutiques, des employés, et Marée Express à faire reculer.</li>
  </ol>
  <p>Le mini-jeu : arrête le curseur dans le <b style="color:var(--ok)">vert</b> (pris), l’<b style="color:var(--orange)">orange</b> (un dé décide) ou le <b style="color:var(--accent)">rouge</b> (raté). Le temps n’avance que quand tu agis : un lancer prend 15 minutes, une journée va de 6 h à minuit.</p>
  <p class="why">Ta partie est sauvegardée automatiquement dans ce navigateur.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn main" id="mOk">Ouvrir le carnet</button></div>`);
  $('#mOk').onclick=()=>{S.intro=true;save();ac();closeModal();scene('Chapitre 1','Quarante euros',[[null,'Le volet de Saint-Aubin est baissé, une affiche SAISIE collée dessus. Dans le manche de la canne, un carnet roulé.'],[null,'Première ligne, d’une écriture serrée : « Commence par l’étang. Le gardon pardonne tout. »']]);renderAll();};$('#mOk').focus();
}

S=load();resetFishing();renderAll();if(!S.intro)showIntro();
window.__b={offerEnd,endLarge,endComptoir,board,musicTick,scene,storyTick,maybeDecision,DECS,notify,finale,get S(){return S},G,cast,stopMG,endDay,travel,renderAll,press,tech,tideHigh,canBite,FBY,FISH,step};
requestAnimationFrame(t=>{last=t;step(t);});
})();
